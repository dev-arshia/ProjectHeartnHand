<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report a Found / Rescued Person — ProjectHeartnHand</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>Report a Found / Rescued Person</h1>
    <p>For relief camps, hospitals, volunteers, or anyone who has located someone.</p>
  </header>

  <main class="container">
    <div id="message-box"></div>

    <form id="found-form" class="card">
      <input type="hidden" name="report_type" value="found">

      <div class="field">
        <label for="source_channel">Reporting on behalf of <span class="required">*required</span></label>
        <select id="source_channel" name="source_channel" required>
          <option value="camp">Relief camp</option>
          <option value="hospital">Hospital</option>
          <option value="helpline">Helpline</option>
          <option value="volunteer">Volunteer</option>
          <option value="public">Member of the public</option>
        </select>
      </div>

      <div class="field">
        <label for="full_name">Full name (as given, even if unsure of spelling) <span class="required">*required</span></label>
        <input type="text" id="full_name" name="full_name" required>
      </div>

      <div class="field">
        <label for="age">Approximate age</label>
        <input type="number" id="age" name="age" min="0" max="120">
      </div>

      <div class="field">
        <label for="gender">Gender</label>
        <select id="gender" name="gender">
          <option value="">Prefer not to say / unknown</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="field">
        <label for="location">Where they were found <span class="required">*required</span></label>
        <input type="text" id="location" name="location" placeholder="e.g. Relief camp near Jaipur" required>
      </div>

      <div class="field">
        <label for="event_datetime">Date/time found</label>
        <input type="datetime-local" id="event_datetime" name="event_datetime">
      </div>

      <div class="field">
        <label for="description">Clothing / physical description</label>
        <textarea id="description" name="description" placeholder="e.g. Blue shirt, appears to be in good health"></textarea>
      </div>

      <div class="field">
        <label for="identifying_marks">Identifying marks
          <span class="hint">Scars, tattoos, birthmarks, etc.</span>
        </label>
        <textarea id="identifying_marks" name="identifying_marks"></textarea>
      </div>

      <div class="field">
        <label for="photo">Photo <span class="hint">Optional, but helps a lot with matching.</span></label>
        <input type="file" id="photo" name="photo" accept="image/png, image/jpeg, image/webp">
      </div>

      <div class="field checkbox-field">
        <input type="checkbox" id="is_minor" name="is_minor" value="true">
        <label for="is_minor">This person is a minor (under 18)</label>
      </div>

      <hr>

      <div class="field">
        <label for="reporter_name">Your name
          <span class="hint">Optional — helps us follow up if needed.</span>
        </label>
        <input type="text" id="reporter_name" name="reporter_name">
      </div>

      <div class="field">
        <label for="reporter_contact">Your phone number or email
          <span class="hint">Optional.</span>
        </label>
        <input type="text" id="reporter_contact" name="reporter_contact">
      </div>

      <button type="submit" class="btn btn-primary btn-block">Submit Report</button>
    </form>

    <p><a href="index.html">&larr; Back to home</a></p>
  </main>

  <script src="/js/report-form.js"></script>
  <script>
    setupReportForm('found-form', 'message-box');
  </script>
</body>
</html>
